{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto text-center" style="max-width: 640px;">
        <div class="card-body p-5">
            <i class="bi bi-exclamation-triangle fs-1 text-warning" aria-hidden="true"></i>
            <h1 class="h3 fw-bold mt-3">Une erreur est survenue.</h1>
            <p class="text-muted">La demande n'a pas pu être traitée. Réessayez plus tard.</p>
            <a href="{% url 'home' %}" class="btn btn-primary">
                <i class="bi bi-house me-1" aria-hidden="true"></i>Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
